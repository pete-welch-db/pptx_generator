bundle:
  name: denso_pptx_generator

variables:
  catalog:
    description: "Unity Catalog name (e.g. my_workspace_catalog)"
  warehouse_id:
    description: "SQL Warehouse ID for AI functions"

workspace:
  host: https://fe-sandbox-serverless-sandbox-hsze05.cloud.databricks.com
  profile: pptx-demo

resources:
  apps:
    denso-pptx-generator:
      name: denso-pptx-generator
      description: "DENSO AI-Powered Engineering PPTX Generator"
      source_code_path: ./app

  jobs:
    setup_gold_tables:
      name: "[DENSO Demo] Setup Gold Tables & Drawings"
      tasks:
        - task_key: setup_catalog
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/01_setup_catalog.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: load_gold_data
          depends_on:
            - task_key: setup_catalog
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/02_load_gold_tables.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: load_drawings
          depends_on:
            - task_key: setup_catalog
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/03_load_drawings.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: analyze_drawings
          depends_on:
            - task_key: load_drawings
          environment_key: default
          notebook_task:
            notebook_path: ./notebooks/04_analyze_drawings.py
            base_parameters:
              catalog: ${var.catalog}
      environments:
        - environment_key: default
          spec:
            client: "1"
