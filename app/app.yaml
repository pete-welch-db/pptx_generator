command:
  - streamlit
  - run
  - app.py
  - --server.port=8000
  - --server.address=0.0.0.0

env:
  - name: CATALOG
    description: "Unity Catalog name (e.g. my_workspace_catalog)"
  - name: SCHEMA
    description: "Schema name for demo tables"
    value: "denso_demo"

resources:
  - name: sql-warehouse
    sql_warehouse:
      permission: CAN_USE
  - name: serving-endpoint
    serving_endpoint:
      permission: CAN_QUERY
